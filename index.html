<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>КардиоРеаб</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B5578">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КардиоРеаб">
<link rel="apple-touch-icon" href="icons/Icon-192.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
  :root{
    --primary:#3B5578; --primary-dark:#25344A; --primary-light:#EAF0F7;
    --emergency:#B0454B; --emergency-light:#F6E7E8;
    --pending:#B8860B; --pending-light:#FAF3E6;
    --bg:#F7F8FA; --ok:#3d8b57; --border:#DCE3EC;
  }
  *{box-sizing:border-box;}
  /* Полноэкранный режим — в отличие от demo-версии (patient-app-v2.html
     с рамкой-муляжом телефона для показа на десктопе), здесь приложение
     занимает весь реальный viewport, как Herald Chat Web: это тот же
     HTML/CSS/JS, что и в demo (визуально копирует Flutter-приложение —
     см. AppColors/AppTheme в lib/theme/app_theme.dart), но рассчитан на
     установку на экран «Домой» и запуск как настоящее отдельное
     приложение, а не на просмотр внутри окна браузера на компьютере.
     env(safe-area-inset-*) — отступы под чёлку/индикатор Home на iPhone
     (viewport-fit=cover в <meta name="viewport"> выше обязателен, иначе
     эти переменные всегда равны 0). */
  html, body{height:100%;}
  body{margin:0; font-family:"Segoe UI", Arial, sans-serif; background:var(--bg);
    overflow:hidden; /* прокручивается только .content, не вся страница */}
  #screenRoot{width:100%; height:100%; background:var(--bg);
    display:flex; flex-direction:column; position:relative;}
  .topbar{background:var(--primary); color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px 16px; display:flex;
    align-items:center; justify-content:space-between; flex-shrink:0;}
  .topbar h1{font-size:16.5px; margin:0; font-weight:600;}
  .topbar .icons{display:flex; gap:12px;}
  .topbar button{background:none; border:none; color:#fff; font-size:17px; cursor:pointer; padding:2px;}
  .sync-banner{font-size:11px; padding:5px 16px; background:var(--primary-light); color:var(--primary);
    display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .sync-banner.err{background:var(--emergency-light); color:var(--emergency);}
  .sync-banner .dot{width:6px; height:6px; border-radius:50%; background:var(--ok); flex-shrink:0;}
  .content{flex:1; overflow-y:auto; padding:14px 16px calc(90px + env(safe-area-inset-bottom)) 16px;}
  .bottomnav{position:absolute; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    display:flex; padding:4px 2px calc(8px + env(safe-area-inset-bottom)) 2px; overflow-x:auto;}
  .bottomnav button{flex:1; min-width:50px; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:2px; font-size:9.5px; color:#8b95a5; cursor:pointer; padding:5px 1px; position:relative;}
  .bottomnav button .ic{font-size:17px;}
  .bottomnav button.active{color:var(--primary); font-weight:600;}
  .badge-dot{position:absolute; top:2px; right:10px; width:7px; height:7px; border-radius:50%; background:var(--emergency);}

  .section-card{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .section-card h3{margin:0 0 4px 0; font-size:14.5px; color:var(--primary-dark);}
  .section-card .desc{font-size:12px; color:#6b7a90;}
  .art-list-item{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
  .art-list-item:last-child{border-bottom:none;}
  .art-list-item .ic{font-size:19px;}
  .art-list-item .title{font-size:13.5px; color:var(--primary-dark); font-weight:600;}
  .art-list-item .sub{font-size:11.5px; color:#8b95a5;}
  .back-row{display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer; color:var(--primary); font-size:13px;}
  .article-body img, .article-body video{width:100%; border-radius:10px; margin:8px 0;}
  .placeholder-box{border:1.5px dashed var(--pending); background:var(--pending-light); color:var(--pending);
    border-radius:10px; padding:14px; font-size:12px; text-align:center; margin:8px 0;}
  .article-body h1{font-size:16px; color:var(--primary-dark); margin:14px 0 6px 0;}
  .article-body h2{font-size:14px; color:var(--primary-dark); margin:12px 0 5px 0;}
  .article-body p{font-size:13.5px; line-height:1.55; margin:5px 0; color:#33404f;}
  .article-body li{font-size:13.5px; line-height:1.5; color:#33404f;}

  input, select, textarea{font-family:inherit; font-size:13.5px; border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; width:100%; background:#fff; color:var(--primary-dark);}
  label.f-label{display:block; font-size:11.5px; color:#6b7a90; margin-bottom:4px; margin-top:8px;}
  button.btn{background:var(--primary); color:#fff; border:none; border-radius:8px; padding:9px 14px;
    font-size:13.5px; cursor:pointer;}
  button.btn.ghost{background:transparent; border:1px solid var(--primary); color:var(--primary);}
  button.btn.emergency{background:var(--emergency);}
  button.btn.small{padding:5px 10px; font-size:12px;}
  button.btn:disabled{opacity:.5; cursor:default;}
  .row{display:flex; gap:8px;} .row.wrap{flex-wrap:wrap;}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
  .pill.ok{background:#e6f4ea; color:var(--ok);}
  .pill.warn{background:var(--emergency-light); color:var(--emergency);}
  .diary-entry{display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--border);}
  .diary-entry:last-child{border-bottom:none;}
  .mode-tabs{display:flex; gap:6px; margin-bottom:10px;}
  .mode-tabs button{flex:1; padding:7px; border-radius:8px; border:1px solid var(--border); background:#fff;
    font-size:12px; color:var(--primary-dark); cursor:pointer;}
  .mode-tabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .q-block{margin-bottom:14px; border:1px solid var(--border); border-radius:10px; padding:10px;}
  .q-block.missing{border-color:var(--emergency);}
  .q-block .qtext{font-size:13.5px; margin-bottom:6px; color:var(--primary-dark); font-weight:600;}
  .opt-row{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;}
  .checklist-title{font-size:14px; font-weight:700; margin:14px 0 6px 0; color:var(--primary-dark);}
  /* align-items:flex-start (не center) — иначе у пунктов, чей текст
     переносится на 2-3 строки, чекбокс "уплывает" вниз, к середине
     абзаца, и весь чек-лист визуально выглядит "съехавшим" построчно
     (баг, который заметили на телефоне — см. переписку). Чекбоксу
     нужен небольшой margin-top, чтобы он визуально выровнялся по
     первой строке текста, а не прилипал к самому верху ряда. */
  .check-row{display:flex; align-items:flex-start; gap:8px; padding:6px 0; font-size:13.5px;}
  /* width:auto перебивает глобальное правило "input{width:100%}" выше —
     без него чекбокс (теперь с flex-shrink:0, чтобы не сжимался) занял
     бы всю ширину строки, а не 13-14px положенных ему по умолчанию. */
  .check-row input[type="checkbox"]{flex-shrink:0; width:auto; margin-top:2px;}
  .check-row .check-row-text{flex:1; min-width:0; word-break:break-word;}
  .check-row.done{color:#9aa5b2; text-decoration:line-through;}

  .overlay{position:fixed; inset:0; background:rgba(37,52,74,.45); display:none; align-items:center; justify-content:center; z-index:100;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:14px; padding:20px; width:340px; max-width:90vw;}
  .modal h2{margin:0 0 12px 0; font-size:15px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:#6b7a90; margin-bottom:4px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
  .hint{font-size:11px; color:#8b95a5; margin-top:6px; line-height:1.5;}

  /* AppLock */
  .lock-screen{position:absolute; inset:0; background:var(--bg); z-index:50; display:flex;
    flex-direction:column; align-items:stretch; justify-content:center; padding:28px;}
  .lock-screen .lock-ic{font-size:40px; text-align:center; margin-bottom:10px;}
  .lock-screen p{text-align:center; font-size:14.5px; color:var(--primary-dark); margin-bottom:18px;}
  .lock-error{color:var(--emergency); font-size:12.5px; text-align:center; margin-top:8px;}

  /* Чат / claim */
  .chat-scroll{flex:1; overflow-y:auto; padding:6px 2px; display:flex; flex-direction:column;}
  /* Плотная вёрстка внутри "пачки" подряд идущих сообщений одной стороны
     (см. группировку в drawChatMessages) — как в телеге: минимум зазора
     между сообщениями одного отправителя, заметный отступ — только в
     начале новой пачки (.msg-row.group-start). */
  .msg-row{display:flex; margin-bottom:2px;}
  .msg-row.group-start{margin-top:8px;}
  .msg-row.out{justify-content:flex-end;}
  .msg-col{display:flex; flex-direction:column; max-width:78%;}
  .bubble{padding:8px 9px 7px 11px; border-radius:14px; font-size:13px; line-height:1.4;
    min-width:0; position:relative; cursor:pointer; user-select:text;}
  .bubble.in{background:#fff; border:1px solid var(--border);}
  .bubble.out{background:var(--primary); color:#fff;}
  .bubble-text{white-space:pre-wrap; word-break:break-word;}
  /* время + галочки — «утоплены» в правый нижний угол пузыря, как в
     телеграме: последний span внутри текста, float:right заставляет
     текст обтекать его вместо того, чтобы занимать отдельную строку. */
  .msg-time-inline{float:right; margin:3px 0 -2px 8px; font-size:10px; line-height:1;
    white-space:nowrap; display:inline-flex; align-items:center; gap:2px; opacity:.7;}
  .msg-time-inline .ticks{font-size:11px;}
  .msg-time-inline .ticks .tick.blue{color:#8fd0ff;}
  .msg-edited-mark{font-size:9.5px; font-style:italic; margin-right:2px;}
  .msg-retry{color:var(--emergency); font-weight:700; cursor:pointer; font-size:12px;}
  /* цитата отвечаемого сообщения — внутри пузыря, над текстом ответа.
     overflow:hidden + line-clamp вместо nowrap — чтобы длинная цитата не
     "раздувала" пузырь по ширине (баг, который мы уже словили и починили
     в командном чате — тут делаем сразу правильно). */
  .reply-quote{border-left:3px solid var(--primary); padding:2px 7px; margin-bottom:4px;
    background:rgba(0,0,0,.05); border-radius:4px; cursor:pointer; overflow:hidden;}
  .bubble.out .reply-quote{background:rgba(255,255,255,.15); border-left-color:#fff;}
  .reply-quote-from{font-size:10.5px; font-weight:700; color:var(--primary);}
  .bubble.out .reply-quote-from{color:#fff;}
  .reply-quote-text{font-size:11.5px; opacity:.8; overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:1; -webkit-box-orient:vertical; word-break:break-word;}
  .msg-edited-tag{opacity:.7;}
  /* реакции — прижаты к нижнему краю пузыря внахлёст, как чипсы в телеге */
  .reactions{display:flex; flex-wrap:wrap; gap:3px; margin-top:-8px; padding:0 2px; position:relative; z-index:2;}
  .msg-row.out .reactions{justify-content:flex-end;}
  .reaction-chip{display:flex; align-items:center; gap:2px; padding:1px 6px; border-radius:10px; font-size:10.5px;
    border:2px solid var(--bg); background:#fff; cursor:pointer;}
  .reaction-chip.mine{border-color:var(--bg); background:var(--primary-light);}
  .quick-react-bar{display:flex; gap:1px; justify-content:flex-end; margin:2px 0 0 0;}
  .msg-row.in .quick-react-bar{justify-content:flex-start;}
  .quick-react-bar span{cursor:pointer; padding:2px 4px; font-size:13px; border-radius:50%;}
  .quick-react-bar span:hover{background:var(--primary-light);}
  .quick-react-bar .qr-more{font-size:14px; font-weight:700; color:#8b95a5;}
  .reply-preview{display:flex; align-items:center; gap:8px; padding:6px 8px; border-top:1px solid var(--border);
    background:var(--primary-light); border-radius:8px; margin-bottom:6px;}
  .reply-preview-bar{width:3px; align-self:stretch; background:var(--primary); border-radius:2px; flex-shrink:0;}
  .reply-preview-body{flex:1; min-width:0;}
  .reply-preview-from{font-size:11px; font-weight:700; color:var(--primary);}
  .reply-preview-text{font-size:11.5px; color:#6b7a90; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .reply-preview-close{background:none; border:none; font-size:15px; color:#6b7a90; cursor:pointer; flex-shrink:0;}
  .chat-reply{display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--border);}
  .chat-reply textarea{flex:1; min-height:38px; max-height:80px;}
  .chat-unread-badge{position:absolute; top:1px; right:6px; min-width:15px; height:15px; padding:0 3px;
    border-radius:8px; background:var(--emergency); color:#fff; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;}
  /* нижний лист действий над сообщением — переиспользует .overlay/.modal
     (уже есть в приложении для диалога периода опроса), чтобы не тащить
     отдельную визуальную систему для одной фичи */
  .msg-sheet-item{padding:11px 6px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:9px;
    border-bottom:1px solid var(--border); color:var(--primary-dark);}
  .msg-sheet-item:last-child{border-bottom:none;}
  .msg-sheet-item.danger{color:var(--emergency);}
  .msg-sheet-emojis{display:flex; justify-content:space-around; padding:10px 0; border-bottom:1px solid var(--border); margin-bottom:4px;}
  .msg-sheet-emojis span{font-size:22px; cursor:pointer; padding:4px;}
  .disclaimer-strip{background:var(--primary-light); color:var(--primary-dark); font-size:11.5px;
    padding:7px 10px; border-radius:8px; margin-bottom:8px;}
  .claim-wrap{display:flex; flex-direction:column; align-items:stretch; height:100%; justify-content:center;}
  .claim-code-input{font-size:26px; text-align:center; letter-spacing:8px;}
</style>
</head>
<body>

<div id="screenRoot">
  <!-- AppLock -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-ic">🔒</div>
    <p>Введите пароль для входа в приложение</p>
    <input id="lockPass" type="password" placeholder="Пароль">
    <div class="lock-error" id="lockError"></div>
    <div style="margin-top:14px;"><button class="btn" id="lockSubmit" style="width:100%;">Войти</button></div>
    <div class="hint" style="text-align:center; margin-top:10px;">Встроенный пароль работает всегда офлайн. Дополнительный пароль (если выдан администратором) проверяется онлайн.</div>
  </div>

  <div class="topbar">
    <h1 id="topTitle">Методичка</h1>
    <div class="icons"><button id="topRefresh" title="Обновить">🔄</button></div>
  </div>
  <div class="sync-banner" id="syncBanner"><span class="dot"></span><span id="syncLabel">—</span></div>

  <div class="content" id="content"></div>

  <div class="bottomnav">
    <button class="nav-btn active" data-tab="library"><span class="ic">📖</span>Методичка</button>
    <button class="nav-btn" data-tab="checklists"><span class="ic">✅</span>Чек-листы</button>
    <button class="nav-btn" data-tab="diary"><span class="ic">❤️</span>Дневник</button>
    <button class="nav-btn" data-tab="surveys"><span class="ic">📝</span>Анкеты</button>
    <button class="nav-btn" data-tab="meds"><span class="ic">💊</span>Лекарства</button>
    <button class="nav-btn" data-tab="chat"><span class="ic">💬</span>Чат</button>
    <button class="nav-btn" data-tab="announcements" id="navAnn"><span class="ic">📣</span>Оповещения</button>
  </div>
</div>

<!-- диалог периода опроса чата -->
<div class="overlay" id="pollOverlay">
  <div class="modal">
    <h2>⏱ Период обновления чата, сек</h2>
    <div class="field"><input id="pollSeconds" type="number" min="5" value="75"></div>
    <div class="hint">Минимум 5 секунд. По умолчанию — 75 сек, чтобы не сажать батарею.</div>
    <div class="modal-actions">
      <button class="btn ghost" id="closePoll">Отмена</button>
      <button class="btn" id="savePoll">Сохранить</button>
    </div>
  </div>
</div>

<!-- нижний лист действий над сообщением чата (копировать/ответить/изменить/удалить/закрепить/реакция) -->
<div class="overlay" id="msgActionsOverlay">
  <div class="modal" id="msgActionsModal" style="padding:8px 10px 14px 10px;"></div>
</div>

<script>
/* ======================================================================
   КардиоРеаб — приложение пациента (демо в рамке телефона).

   Никакого Яндекс-токена, Client ID и т.п. здесь нет — приложение
   общается ОДНИМ POST-запросом со своим сервером (Yandex Cloud
   Function), который сам знает, как достучаться до Яндекс Диска.
   Единственное, что вводит пациент — 6-значный код при первом входе в
   чат, и (если задан) пароль на входе в приложение.
====================================================================== */

const BACKEND_URL = "https://functions.yandexcloud.net/d4e20a2aj3ug7ivdkjli";
const CONTENT_URL = "https://raw.githubusercontent.com/nikitsmm/CardioRehub/refs/heads/main/content.json";
const SURVEYS_URL = "https://raw.githubusercontent.com/nikitsmm/CardioRehub/refs/heads/main/surveys.json";
const BUILT_IN_PASSWORD = "Reabilitation_Ob";
const STORAGE_PREFIX = "kardiorehab_patient_";

function storageGet(key){ try{ return localStorage.getItem(STORAGE_PREFIX + key); }catch(e){ return null; } }
function storageSet(key, val){ try{ localStorage.setItem(STORAGE_PREFIX + key, val); }catch(e){} }

function uuidv4(){
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

async function api(action, params = {}){
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...params })
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){
    state.session = null;
    storageSet("session", "");
  }
  if(!res.ok || data.error){
    throw new Error(data.error_description || data.error || ("HTTP " + res.status));
  }
  return data;
}

const state = {
  session: storageGet("session") || null,
  accountId: storageGet("accountId") || null,
  deviceId: storageGet("deviceId") || uuidv4(),
  unlocked: false,
  tab: "library",
  content: { sections: [], checklists: [], emergencyContacts: [] },
  surveys: [],
  libraryStack: [],
  checklistDone: new Set(),
  diaryEntries: [],
  meds: [ { id:"m1", name:"Варфарин", dose:"2,5 мг", times:["08:00"] } ],
  chatMessages: [],
  pinnedMessages: [],
  lastReadByAdmin: 0,        // до какой версии треда админ точно видел мои сообщения — для галочек
  lastSeenVersion: parseInt(storageGet("lastSeenVersion") || "0", 10),  // локально: что я сам уже видел (для бейджа непрочитанных)
  replyTo: null,             // {id, from, text} — сообщение, на которое отвечаем, см. setReplyTo()
  editingMessageId: null,    // id своего сообщения, которое сейчас редактируется
  pollSeconds: 75,
  pollTimer: null,
  unreadPollTimer: null,     // фоновый поллер бейджа непрочитанных на вкладке "Чат" (работает и вне вкладки чата)
  announcements: []
};
if(!storageGet("deviceId")) storageSet("deviceId", state.deviceId);

const content = document.getElementById("content");
const get = id => document.getElementById(id);

// ---------- контент методички/анкет — реальные данные с GitHub ----------
async function loadContent(){
  try{
    const res = await fetch(CONTENT_URL);
    if(!res.ok) throw new Error("http " + res.status);
    state.content = await res.json();
    setSyncBanner("Контент обновлён", "ok");
  }catch(e){
    setSyncBanner("Нет связи — используется кэш", "warn");
    if(!state.content.sections || state.content.sections.length === 0){
      state.content = { sections:[{ id:"s1", title:"Первые дни после операции", icon:"heart", summary:"Базовые рекомендации", articles:[
        { id:"activity-breathing", title:"Дыхательная гимнастика", icon:"lungs", blocks:[

// ---------- Markdown (как в markdown_text.dart) ----------
function renderMarkdown(md){
  const lines = md.split("\n"); let html = ""; let inList = false;
  lines.forEach(line=>{
    const l = line.trim();
    if(l.startsWith("# ")){ if(inList){html+="</ul>";inList=false;} html += `<h1>${inlineMd(l.slice(2))}</h1>`; }
    else if(l.startsWith("## ")){ if(inList){html+="</ul>";inList=false;} html += `<h2>${inlineMd(l.slice(3))}</h2>`; }
    else if(l.startsWith("- ")||l.startsWith("* ")){ if(!inList){html+="<ul>";inList=true;} html += `<li>${inlineMd(l.slice(2))}</li>`; }
    else if(l === ""){ if(inList){html+="</ul>";inList=false;} html += `<div style="height:8px;"></div>`; }
    else { if(inList){html+="</ul>";inList=false;} html += `<p>${inlineMd(l)}</p>`; }
  });
  if(inList) html += "</ul>";
  return html;
}
function inlineMd(t){
  return escapeHtml(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/_(.+?)_/g,"<i>$1</i>");
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderLibrary(){
  if(state.libraryStack.length === 0){
    let html = `<div class="row" style="margin-bottom:10px;"><input id="libSearch" placeholder="Поиск по методичке"></div>`;
    (state.content.sections||[]).forEach(sec=>{
      html += `<div class="section-card"><h3>${escapeHtml(sec.title)}</h3><div class="desc">${escapeHtml(sec.summary||"")}</div>`;
      (sec.articles||[]).forEach(a=>{
        html += `<div class="art-list-item" data-art="${a.id}"><span class="ic">📄</span><span class="title">${escapeHtml(a.title)}</span></div>`;
      });
      html += `</div>`;
    });
    content.innerHTML = html || `<div class="section-card">Контент загружается...</div>`;
    content.querySelectorAll(".art-list-item").forEach(el=>{
      el.addEventListener("click", ()=>{ state.libraryStack.push(findArticle(el.dataset.art)); renderLibrary(); });
    });
    get("libSearch")?.addEventListener("input", (e)=>{
      const q = e.target.value.trim().toLowerCase();
      if(!q){ renderLibrary(); return; }
      const hits = [];
      (state.content.sections||[]).forEach(sec=> (sec.articles||[]).forEach(a=>{
        const text = (a.blocks||[]).filter(b=>b.type==="text").map(b=>b.value).join(" ");
        if(a.title.toLowerCase().includes(q) || text.toLowerCase().includes(q)) hits.push({sec,a});
      }));
      content.innerHTML = `<div class="row" style="margin-bottom:10px;"><input id="libSearch" value="${escapeHtml(q)}"></div>` +
        (hits.length ? hits.map(h=>`<div class="section-card"><div class="art-list-item" data-art="${h.a.id}"><span class="ic">📄</span><div><div class="title">${escapeHtml(h.a.title)}</div><div class="sub">${escapeHtml(h.sec.title)}</div></div></div></div>`).join("")
          : `<div class="section-card">Ничего не найдено</div>`);
      content.querySelectorAll(".art-list-item").forEach(el=>{
        el.addEventListener("click", ()=>{ state.libraryStack.push(findArticle(el.dataset.art)); renderLibrary(); });
      });
      get("libSearch").focus();
    });
  } else {
    const art = state.libraryStack[state.libraryStack.length-1];
    let html = `<div class="back-row" id="libBack">← Назад</div><div class="article-body"><h1 style="margin-top:0;">${escapeHtml(art.title)}</h1>`;
    (art.blocks||[]).forEach(b=>{
      if(b.type === "text") html += renderMarkdown(b.value||"");
      else if(b.type === "image") html += b.value ? `<img src="${b.value}">` : `<div class="placeholder-box">📷 ${escapeHtml(b.hint||"материал ожидается")}</div>`;
      else if(b.type === "video") html += b.value ? `<video controls src="${b.value}"></video>` : `<div class="placeholder-box">🎬 ${escapeHtml(b.hint||"материал ожидается")}</div>`;
    });
    html += `</div>`;
    content.innerHTML = html;
    get("libBack").addEventListener("click", ()=>{ state.libraryStack.pop(); renderLibrary(); });
  }
}
function findArticle(id){
  for(const sec of (state.content.sections||[])) for(const a of (sec.articles||[])) if(a.id === id) return a;
  return { id, title:"—", blocks:[] };
}

function parseNum(s){ const v = parseFloat((s||"").replace(",", ".").trim()); return isNaN(v) ? null : v; }
function updateInrCheck(){
  const inr = parseNum(get("inrVal").value), low = parseNum(get("inrLow").value) ?? 2.0, high = parseNum(get("inrHigh").value) ?? 3.0;
  const res = get("inrResult");
  if(inr === null || low > high){ res.innerHTML = ""; return; }
  if(inr < low) res.innerHTML = `<span class="pill warn">Ниже целевого диапазона (${inr.toFixed(1)})</span><div class="hint">Значение вне цели — свяжитесь с лечащим врачом. Дозу самостоятельно не меняйте.</div>`;
  else if(inr > high) res.innerHTML = `<span class="pill warn">Выше целевого диапазона (${inr.toFixed(1)})</span><div class="hint">Значение вне цели — свяжитесь с лечащим врачом. Дозу самостоятельно не меняйте.</div>`;
  else res.innerHTML = `<span class="pill ok">В пределах целевого диапазона (${inr.toFixed(1)})</span>`;
}
function updateInrCalc(){
  const pt = parseNum(get("ptVal").value), mnpt = parseNum(get("mnptVal").value), isi = parseNum(get("isiVal").value);
  const res = get("inrCalcResult");
  if(pt === null || !mnpt || isi === null){ res.innerHTML = ""; return; }
  const inr = Math.pow(pt/mnpt, isi);
  res.innerHTML = `<span class="pill ok">МНО ≈ ${inr.toFixed(1)}</span><div class="hint">Формула ВОЗ: МНО = (ПВ / среднее нормальное ПВ) ^ МИЧ</div>`;
}

/** Мёрджит свежие сообщения с сервера в state.chatMessages, не теряя
 * локально-оптимистичные записи (см. sendChatMessage) — те, что ещё не
 * подтвердились сервером (status "sending"/"failed"), остаются, пока не
 * заменятся своим же id при успехе. */
function upsertChatMessages(newMsgs){
  const byId = new Map(state.chatMessages.map(m=>[m.id, m]));
  newMsgs.forEach(m=> byId.set(m.id, { ...m, status: "sent" }));
  state.chatMessages = Array.from(byId.values()).sort((a,b)=> new Date(a.sentAt) - new Date(b.sentAt));
}
async function loadThread(){
  if(!state.session) return;
  try{
    const res = await api("fetch_thread", { session: state.session });
    upsertChatMessages(res.messages);
    state.pinnedMessages = res.pinned || [];
    state.lastReadByAdmin = res.lastReadByAdmin || 0;
    const latest = res.messages.reduce((mx,m)=> Math.max(mx, m.version||0), 0);
    if(latest > 0){
      // Отмечаем врачу, что мы видели тред до этой версии — для галочек
      // "прочитано" на ЕГО сообщениях в admin.html.
      api("mark_read", { session: state.session, version: latest }).catch(()=>{});
    }
  }catch(e){}
}

  get("chatSend").addEventListener("click", sendChatMessage);
  get("chatText").addEventListener("keydown", e=>{ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChatMessage(); } });
  get("pollBtn").addEventListener("click", ()=>{ get("pollSeconds").value = state.pollSeconds; get("pollOverlay").classList.add("show"); });
  startPolling();
}
/** Локальный счётчик "я это видел" — только для бейджа непрочитанных на
 * кнопке "Чат" в нижней навигации (см. refreshUnreadBadge). Отдельно от
 * серверного mark_read (тот — для галочек на сообщениях ВРАЧА). */
function markChatSeenLocally(){
  const latest = state.chatMessages.reduce((mx,m)=> Math.max(mx, m.version||0), 0);
  if(latest > state.lastSeenVersion){
    state.lastSeenVersion = latest;
    storageSet("lastSeenVersion", String(latest));
  }
  updateChatNavBadge(0);
}
function updateChatNavBadge(count){
  const btn = document.querySelector('.nav-btn[data-tab="chat"]');
  if(!btn) return;
  let badge = btn.querySelector(".chat-unread-badge");
  if(count > 0){
    if(!badge){ badge = document.createElement("span"); badge.className = "chat-unread-badge"; btn.style.position = "relative"; btn.appendChild(badge); }
    badge.textContent = count > 9 ? "9+" : String(count);
  } else if(badge){
    badge.remove();
  }
}
/** Фоновый поллер бейджа непрочитанных на кнопке "Чат" — работает
 * независимо от того, какая вкладка сейчас открыта (аналог того же
 * механизма в командном чате — favicon-бейдж там, тут — бейдж на кнопке
 * нижней навигации, т.к. у этого демо нет отдельной вкладки браузера). */
function startUnreadPolling(){
  stopUnreadPolling();
  refreshUnreadBadge();
  state.unreadPollTimer = setInterval(refreshUnreadBadge, 20000);
}
function stopUnreadPolling(){ if(state.unreadPollTimer) clearInterval(state.unreadPollTimer); }
async function refreshUnreadBadge(){
  if(!state.session) return;
  try{
    const res = await api("fetch_thread", { session: state.session });
    const latest = res.messages.reduce((mx,m)=> Math.max(mx, m.version||0), 0);
    if(state.tab === "chat"){
      // на вкладке чата пользователь и так видит новые сообщения — не
      // считаем их непрочитанными, а сразу подтягиваем в отрисовку
      upsertChatMessages(res.messages);
      state.pinnedMessages = res.pinned || [];
      state.lastReadByAdmin = res.lastReadByAdmin || 0;
      markChatSeenLocally();
      drawChatMessages();
      drawPinnedBanner();
    } else {
      updateChatNavBadge(Math.max(0, latest - state.lastSeenVersion));
    }
  }catch(e){ /* фоновая необязательная фича — не мешаем остальному приложению */ }
}

function drawPinnedBanner(){
  const wrap = get("pinnedBannerWrap");
  if(!wrap) return;
  if(!state.pinnedMessages || state.pinnedMessages.length === 0){ wrap.innerHTML = ""; return; }
  const p = state.pinnedMessages[state.pinnedMessages.length - 1];
  wrap.innerHTML = `<div class="reply-preview" data-scrollto="${p.id}" style="cursor:pointer; margin-bottom:6px;">
      <div class="reply-preview-bar"></div>
      <div class="reply-preview-body">
        <div class="reply-preview-from">📌 Закреплено${state.pinnedMessages.length>1?` (1 из ${state.pinnedMessages.length})`:""}</div>
        <div class="reply-preview-text">${escapeHtml(p.text)}</div>
      </div></div>`;
  wrap.querySelector("[data-scrollto]").addEventListener("click", ()=>{
    const target = get("chatScroll")?.querySelector(`[data-msg="${p.id}"]`);
    if(target) target.scrollIntoView({ behavior:"smooth", block:"center" });
  });
}

function drawChatMessages(){
  const scroll = get("chatScroll");
  if(!scroll) return;
  const msgs = state.chatMessages;
  if(msgs.length === 0){ scroll.innerHTML = `<div class="hint" style="text-align:center;">Сообщений пока нет</div>`; return; }
  const pinnedIds = new Set((state.pinnedMessages||[]).map(p=>p.id));
  const GROUP_GAP_MS = 5*60*1000;
  const sameGroup = (a,b)=> a && b && a.from === b.from && Math.abs(new Date(b.sentAt)-new Date(a.sentAt)) < GROUP_GAP_MS;
  let html = "";
  msgs.forEach((m,i)=>{
    const mine = m.from === "client" || m.status === "sending" || m.status === "failed";
    const isGroupStart = i === 0 || !sameGroup(msgs[i-1], m);
    const t = new Date(m.sentAt).toLocaleString("ru-RU",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});
    const readByAdmin = mine && m.status === "sent" && m.version > 0 && state.lastReadByAdmin >= m.version;
    let ticksHtml = "";
    if(m.status === "sending") ticksHtml = `<span class="ticks"><span class="tick">✓</span></span>`;
    else if(mine && m.status === "sent") ticksHtml = `<span class="ticks"><span class="tick ${readByAdmin?'blue':''}">✓</span><span class="tick ${readByAdmin?'blue':''}">✓</span></span>`;
    const editedHtml = m.edited ? `<span class="msg-edited-mark">изменено</span>` : "";
    const timeInlineHtml = m.status === "failed"
      ? `<span class="msg-time-inline"><span class="msg-retry" data-retry="${m.id}">⟳ повторить</span></span>`
      : `<span class="msg-time-inline">${editedHtml}${t}${ticksHtml}</span>`;
    const replyHtml = m.replyTo ? `
      <div class="reply-quote" data-scrollto="${m.replyTo.id}">
        <div class="reply-quote-from">${m.replyTo.from === "client" ? "Вы" : "Врач"}</div>
        <div class="reply-quote-text">${escapeHtml(m.replyTo.text)}</div>
      </div>` : "";
    const pinMarkHtml = pinnedIds.has(m.id) ? `<span style="opacity:.6;">📌</span> ` : "";
    const reactionsHtml = m.reactions && Object.keys(m.reactions).length ? `
      <div class="reactions">
        ${Object.entries(m.reactions).filter(([,ids])=>ids.length).map(([emoji,ids])=>`
          <div class="reaction-chip ${ids.includes('client')?'mine':''}" data-react="${m.id}|${emoji}"><span>${emoji}</span><span>${ids.length}</span></div>`).join("")}
      </div>` : "";
    const quickReactHtml = m.status === "sent" ? `
      <div class="quick-react-bar">
        ${REACTION_EMOJIS.map(e=>`<span data-quickreact="${m.id}|${e}">${e}</span>`).join("")}
        <span class="qr-more" data-actions="${m.id}">⋯</span>
      </div>` : "";
    html += `
      <div class="msg-row ${mine?'out':'in'} ${isGroupStart?'group-start':''}">
        <div class="msg-col">
          <div class="bubble ${mine?'out':'in'}" data-msg="${m.id}">
            ${replyHtml}
            <div class="bubble-text">${pinMarkHtml}${escapeHtml(m.text)}${timeInlineHtml}</div>
          </div>
          ${quickReactHtml}
          ${reactionsHtml}
        </div>
      </div>`;
  });
  scroll.innerHTML = html;
  scroll.querySelectorAll("[data-actions]").forEach(el=> el.addEventListener("click", ()=> openMessageActions(el.dataset.actions)));
  scroll.querySelectorAll("[data-retry]").forEach(el=> el.addEventListener("click", ()=> retryChatMessage(el.dataset.retry)));
  scroll.querySelectorAll("[data-react]").forEach(el=> el.addEventListener("click", ()=>{
    const [id, emoji] = el.dataset.react.split("|"); toggleChatReaction(id, emoji);
  }));
  scroll.querySelectorAll("[data-quickreact]").forEach(el=> el.addEventListener("click", ()=>{
    const [id, emoji] = el.dataset.quickreact.split("|"); toggleChatReaction(id, emoji);
  }));
  scroll.querySelectorAll("[data-msg]").forEach(el=> el.addEventListener("contextmenu", e=>{ e.preventDefault(); openMessageActions(el.dataset.msg); }));
  scroll.querySelectorAll("[data-scrollto]").forEach(el=> el.addEventListener("click", e=>{
    e.stopPropagation();
    const target = scroll.querySelector(`[data-msg="${el.dataset.scrollto}"]`);
    if(target) target.scrollIntoView({ behavior:"smooth", block:"center" });
  }));
  scroll.scrollTop = scroll.scrollHeight;
}

function setChatReplyTo(msg){
  state.replyTo = { id: msg.id, from: msg.from, text: msg.text };
  state.editingMessageId = null;
  drawReplyOrEditPreview();
  get("chatText")?.focus();
}
function clearChatReplyTo(){ state.replyTo = null; drawReplyOrEditPreview(); }
function drawReplyOrEditPreview(){
  const wrap = get("replyPreviewWrap");
  if(!wrap) return;
  if(state.editingMessageId){
    const msg = state.chatMessages.find(m=>m.id === state.editingMessageId);
    wrap.innerHTML = `<div class="reply-preview">
        <div class="reply-preview-bar"></div>
        <div class="reply-preview-body"><div class="reply-preview-from">✏️ Изменить сообщение</div>
          <div class="reply-preview-text">${escapeHtml(msg?msg.text:"")}</div></div>
        <button class="reply-preview-close" id="editPreviewClose">✕</button></div>`;
    get("editPreviewClose").addEventListener("click", cancelEditChatMessage);
    return;
  }
  if(!state.replyTo){ wrap.innerHTML = ""; return; }
  wrap.innerHTML = `<div class="reply-preview">
      <div class="reply-preview-bar"></div>
      <div class="reply-preview-body"><div class="reply-preview-from">Ответ ${state.replyTo.from==="client"?"себе":"врачу"}</div>
        <div class="reply-preview-text">${escapeHtml(state.replyTo.text)}</div></div>
      <button class="reply-preview-close" id="replyPreviewClose">✕</button></div>`;
  get("replyPreviewClose").addEventListener("click", clearChatReplyTo);
}

async function sendChatMessage(){
  const el = get("chatText");
  const text = el.value.trim();
  if(!text) return;

  if(state.editingMessageId){
    await submitEditChatMessage(state.editingMessageId, text);
    return;
  }

  const replyTo = state.replyTo;
  el.value = "";
  clearChatReplyTo();
  const localId = uuidv4();
  const optimistic = { id: localId, from: "client", text, sentAt: new Date().toISOString(),
    version: 0, status: "sending", reactions: {}, replyTo: replyTo || null };
  state.chatMessages.push(optimistic);
  drawChatMessages();
  try{
    const payload = { session: state.session, text, messageId: localId };
    if(replyTo) payload.replyTo = replyTo;
    const res = await api("send_message", payload);
    const idx = state.chatMessages.findIndex(m=>m.id === localId);
    if(idx >= 0) state.chatMessages[idx] = { ...res.message, replyTo: res.message.replyTo || optimistic.replyTo || null, status: "sent" };
    drawChatMessages();
  }catch(e){
    const idx = state.chatMessages.findIndex(m=>m.id === localId);
    if(idx >= 0) state.chatMessages[idx].status = "failed";
    drawChatMessages();
  }
}
async function retryChatMessage(localId){
  const msg = state.chatMessages.find(m=>m.id === localId);
  if(!msg) return;
  msg.status = "sending"; drawChatMessages();
  try{
    const payload = { session: state.session, text: msg.text, messageId: localId };
    if(msg.replyTo) payload.replyTo = msg.replyTo;
    const res = await api("send_message", payload);
    const idx = state.chatMessages.findIndex(m=>m.id === localId);
    if(idx >= 0) state.chatMessages[idx] = { ...res.message, replyTo: res.message.replyTo || msg.replyTo || null, status: "sent" };
  }catch(e){
    msg.status = "failed";
  }
  drawChatMessages();
}
async function toggleChatReaction(messageId, emoji){
  const msg = state.chatMessages.find(m=>m.id === messageId);
  if(!msg || msg.status !== "sent") return;
  try{
    const res = await api("toggle_reaction", { session: state.session, messageId, emoji });
    const idx = state.chatMessages.findIndex(m=>m.id === messageId);
    if(idx >= 0) state.chatMessages[idx] = { ...res.message, status: "sent" };
    drawChatMessages();
  }catch(e){
    alert("Не удалось поставить реакцию: " + e.message);
  }
}
async function toggleChatPin(messageId, fromRole, text){
  try{
    const res = await api("toggle_pin", { session: state.session, messageId, from: fromRole, text });
    state.pinnedMessages = res.pinned || [];
    drawPinnedBanner(); drawChatMessages();
  }catch(e){
    alert("Не удалось закрепить сообщение: " + e.message);
  }
}
function startEditChatMessage(msg){
  state.editingMessageId = msg.id;
  state.replyTo = null;
  const el = get("chatText");
  if(el){ el.value = msg.text; el.focus(); }
  drawReplyOrEditPreview();
}
function cancelEditChatMessage(){
  state.editingMessageId = null;
  const wrap = get("replyPreviewWrap"); if(wrap) wrap.innerHTML = "";
  const el = get("chatText"); if(el) el.value = "";
}
async function submitEditChatMessage(messageId, text){
  cancelEditChatMessage();
  try{
    const res = await api("edit_message", { session: state.session, messageId, text });
    const idx = state.chatMessages.findIndex(m=>m.id === messageId);
    if(idx >= 0) state.chatMessages[idx] = { ...state.chatMessages[idx], ...res.message };
    drawChatMessages();
  }catch(e){
    alert("Не удалось изменить сообщение: " + e.message);
  }
}
async function deleteChatMessage(messageId){
  if(!confirm("Удалить сообщение без возможности восстановить?")) return;
  try{
    await api("delete_message", { session: state.session, messageId });
    state.chatMessages = state.chatMessages.filter(m=>m.id !== messageId);
    drawChatMessages();
  }catch(e){
    alert("Не удалось удалить сообщение: " + e.message);
  }
}

// ---- нижний лист действий над сообщением (переиспользует .overlay/.modal) ----
const REACTION_EMOJIS = ["👍","👎","😂","❤️","🔥"];
function openMessageActions(messageId){
  const msg = state.chatMessages.find(m=>m.id === messageId);
  if(!msg) return;
  const canAct = msg.status === "sent";
  const isMine = msg.from === "client";
  const isPinned = (state.pinnedMessages||[]).some(p=>p.id === msg.id);
  const items = [{ id:"copy", icon:"📋", label:"Скопировать текст" }];
  if(canAct) items.push({ id:"reply", icon:"↩️", label:"Ответить" });
  if(canAct && isMine) items.push({ id:"edit", icon:"✏️", label:"Изменить" });
  if(canAct) items.push({ id:"pin", icon:"📌", label: isPinned ? "Открепить" : "Закрепить" });
  if(canAct && isMine) items.push({ id:"delete", icon:"🗑️", label:"Удалить", danger:true });
  get("msgActionsModal").innerHTML = `
    ${canAct ? `<div class="msg-sheet-emojis">${REACTION_EMOJIS.map(e=>`<span data-pick="${e}">${e}</span>`).join("")}</div>` : ""}
    ${items.map(it=>`<div class="msg-sheet-item ${it.danger?'danger':''}" data-do="${it.id}">${it.icon} ${it.label}</div>`).join("")}`;
  get("msgActionsModal").querySelectorAll("[data-do]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const action = el.dataset.do;
      closeMessageActions();
      if(action === "copy") navigator.clipboard?.writeText(msg.text).catch(()=>{});
      else if(action === "reply") setChatReplyTo(msg);
      else if(action === "edit") startEditChatMessage(msg);
      else if(action === "pin") toggleChatPin(msg.id, msg.from, msg.text);
      else if(action === "delete") deleteChatMessage(msg.id);
    });
  });
  get("msgActionsModal").querySelectorAll("[data-pick]").forEach(el=>{
    el.addEventListener("click", ()=>{ toggleChatReaction(msg.id, el.dataset.pick); closeMessageActions(); });
  });
  get("msgActionsOverlay").classList.add("show");
}
function closeMessageActions(){ get("msgActionsOverlay").classList.remove("show"); }
get("msgActionsOverlay").addEventListener("click", e=>{ if(e.target.id === "msgActionsOverlay") closeMessageActions(); });

function startPolling(){
  stopPolling();
  state.pollTimer = setInterval(async ()=>{
    if(state.tab !== "chat" || !state.session) return;
    await loadThread();
    drawChatMessages();
    drawPinnedBanner();
    markChatSeenLocally();
  }, state.pollSeconds * 1000);
}
function stopPolling(){ if(state.pollTimer) clearInterval(state.pollTimer); }

// ----- Оповещения -----
async function renderAnnouncements(){
  content.innerHTML = `<div class="hint">Загрузка...</div>`;
  await refreshAnnouncements();
}
let annStatus = "";
async function refreshAnnouncements(){
  try{
    const res = await api("fetch_announcements");
    state.announcements = res.announcements;
    annStatus = "";
  }catch(e){
    state.announcements = [];
    annStatus = "Не удалось загрузить оповещения: " + e.message;
  }
  drawAnnouncements();
}
function drawAnnouncements(){
  const icons = { contest:"🏆", broadcast:"📡", event:"📅", survey:"📝", other:"📣" };
  let html = `<div class="row" style="margin-bottom:10px;"><button class="btn ghost small" id="annRefresh">🔄 Обновить</button></div>`;
  if(annStatus) html += `<div class="hint" style="margin-bottom:10px;">${escapeHtml(annStatus)}</div>`;
  html += (state.announcements||[]).length ? state.announcements.map(a=>`
    <div class="section-card"><div class="row" style="align-items:flex-start;">
      <span class="ic" style="font-size:20px;">${icons[a.category]||"📣"}</span>
      <div style="flex:1;"><div class="title" style="font-size:14px;">${escapeHtml(a.title)}</div><div style="font-size:13px; color:#33404f; margin-top:4px;">${escapeHtml(a.body)}</div></div>
    </div></div>`).join("") : `<div class="section-card">Оповещений пока нет</div>`;
  content.innerHTML = html;
  get("annRefresh").addEventListener("click", refreshAnnouncements);
}

// ---------- навигация ----------
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    if(state.tab === "library") state.libraryStack = [];
    if(state.tab === "surveys") currentSurvey = null;
    if(state.tab !== "chat") stopPolling();
    render();
  });
});
get("topRefresh").addEventListener("click", async ()=>{ if(state.tab === "library"){ await loadContent(); renderLibrary(); } });

get("closePoll").addEventListener("click", ()=> get("pollOverlay").classList.remove("show"));
get("savePoll").addEventListener("click", ()=>{
  const v = parseInt(get("pollSeconds").value, 10);
  if(!v || v < 5) return;
  state.pollSeconds = v;
  get("pollOverlay").classList.remove("show");
  if(state.tab === "chat") startPolling();
  const btn = get("pollBtn"); if(btn) btn.textContent = `⏱ ${v} с`;
});

// ---------- AppLock ----------
async function submitLock(){
  const entered = get("lockPass").value;
  const err = get("lockError");
  if(!entered){ err.textContent = "Введите пароль"; return; }
  if(entered === BUILT_IN_PASSWORD){ unlock(); return; }
  err.textContent = "Проверка...";
  try{
    const res = await api("check_password", { password: entered });
    if(res.ok){ unlock(); return; }
    err.textContent = "Неверный пароль";
  }catch(e){
    err.textContent = "Не удалось проверить пароль. Проверьте интернет и попробуйте снова.";
  }
}
function unlock(){
  get("lockScreen").style.display = "none";
  state.unlocked = true;
}
get("lockSubmit").addEventListener("click", submitLock);
get("lockPass").addEventListener("keydown", e=>{ if(e.key === "Enter") submitLock(); });

// ---------- init ----------
(async function init(){
  await loadContent();
  await loadSurveys();
  if(state.session && state.accountId){
    await loadThread();
    startUnreadPolling();
  }
  render();
})();
</script>
